name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.18.0', '20.x', '22.x']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Check package assembly
        run: npm pack --dry-run --json

      - name: Check CLI smoke path
        run: |
          node dist/cli/index.js capabilities --json
          node dist/cli/index.js check --root . fixtures/valid.cfm --json
          node dist/cli/index.js check --root . fixtures/misnested.cfm --json
