name: Monorepo verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run bootstrap
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-node${{ matrix.node }}
          path: .cache/*-results.json
          include-hidden-files: true
